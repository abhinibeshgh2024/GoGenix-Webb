<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Webb | Fronto Editor</title>
  
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QXVCXKPVBC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QXVCXKPVBC');
  </script>

  <link rel="icon" type="image/jpeg" sizes="32x32" href="favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #080808;
      --google-blue: #4285F4;
      --ms-border: rgba(255, 255, 255, 0.1);
      --glass: rgba(255, 255, 255, 0.05);
      --editor-bg: #1e1e1e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, #111827 0%, #080808 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* --- HEADER --- */
    header { padding: 20px; text-align: center; z-index: 100; }
    header img { width: 140px; margin-bottom: 5px; filter: drop-shadow(0 0 10px rgba(66,133,244,0.2)); }
    header h1 { font-size: 12px; letter-spacing: 5px; text-transform: uppercase; color: var(--google-blue); font-weight: 900; }

    /* --- LAYOUT GRID --- */
    .app-container {
      display: grid;
      grid-template-columns: 260px 1fr;
      flex: 1;
      height: calc(100vh - 120px);
    }

    /* --- SIDEBAR --- */
    .sidebar {
      background: var(--glass);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--ms-border);
      padding: 20px;
      overflow-y: auto;
    }

    .sidebar h2 { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #64748b; margin-bottom: 15px; }

    .snippet-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--ms-border);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .snippet-card:hover { background: var(--google-blue); border-color: transparent; transform: translateX(5px); }
    .snippet-card i { font-size: 14px; opacity: 0.7; }

    /* --- MAIN EDITOR AREA --- */
    .main-editor {
      display: grid;
      grid-template-rows: 1fr 1fr;
      padding: 10px;
      gap: 10px;
    }

    .code-panels {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .panel {
      display: flex;
      flex-direction: column;
      background: var(--glass);
      border: 1px solid var(--ms-border);
      border-radius: 20px;
      overflow: hidden;
    }

    .panel-header {
      padding: 8px 15px;
      background: rgba(255,255,255,0.05);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: #e2e8f0;
      padding: 15px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      resize: none;
      outline: none;
      line-height: 1.5;
    }

    /* --- OUTPUT AREA --- */
    .output-container {
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    iframe { width: 100%; height: 100%; border: none; background: white; }

    /* --- MOBILE --- */
    @media (max-width: 900px) {
      .app-container { grid-template-columns: 1fr; }
      .sidebar { display: none; } /* Snippets hidden on mobile for space */
      .code-panels { grid-template-columns: 1fr; height: 600px; }
    }
  </style>
</head>

<body>

<header>
  <img src="WEBB-removebg-preview.png" alt="Webb Logo">
  <h1>Webb Fronto Editor</h1>
</header>

<div class="app-container">
  <aside class="sidebar">
    <h2>Snippet Intelligence</h2>
    
    <div class="snippet-card" onclick="loadSnippet('btn')">
      <i class="fa fa-mouse-pointer"></i> Neon Button
    </div>
    
    <div class="snippet-card" onclick="loadSnippet('card')">
      <i class="fa fa-id-card"></i> Glassmorphic Card
    </div>
    
    <div class="snippet-card" onclick="loadSnippet('grid')">
      <i class="fa fa-th-large"></i> 3-Column Grid
    </div>
    
    <div class="snippet-card" onclick="loadSnippet('anim')">
      <i class="fa fa-wand-magic-sparkles"></i> Floating Animation
    </div>

    <div class="snippet-card" onclick="loadSnippet('reset')">
      <i class="fa fa-refresh"></i> Clear Editor
    </div>
  </aside>

  <main class="main-editor">
    <div class="code-panels">
      <div class="panel">
        <div class="panel-header">HTML <i class="fa fa-code"></i></div>
        <textarea id="htmlCode" spellcheck="false" placeholder="<div>Hello World</div>"></textarea>
      </div>
      
      <div class="panel">
        <div class="panel-header">CSS <i class="fa fa-css3-alt"></i></div>
        <textarea id="cssCode" spellcheck="false" placeholder="body { background: #000; }"></textarea>
      </div>
      
      <div class="panel">
        <div class="panel-header">JS <i class="fa fa-js"></i></div>
        <textarea id="jsCode" spellcheck="false" placeholder="console.log('Ready');"></textarea>
      </div>
    </div>

    <div class="output-container">
      <iframe id="outputFrame"></iframe>
    </div>
  </main>
</div>

<script>
  const htmlEditor = document.getElementById('htmlCode');
  const cssEditor = document.getElementById('cssCode');
  const jsEditor = document.getElementById('jsCode');
  const output = document.getElementById('outputFrame');

  // Real-time automatic execution
  function updatePreview() {
    const content = `
      <!DOCTYPE html>
      <html>
        <head>
          <style>
            body { margin: 0; font-family: sans-serif; }
            ${cssEditor.value}
          </style>
        </head>
        <body>
          ${htmlEditor.value}
          <script>${jsEditor.value}<\/script>
        </body>
      </html>
    `;
    const doc = output.contentDocument || output.contentWindow.document;
    doc.open();
    doc.write(content);
    doc.close();
  }

  // Listeners for auto-run
  [htmlEditor, cssEditor, jsEditor].forEach(el => {
    el.addEventListener('input', updatePreview);
  });

  // Snippet Library Data
  const snippets = {
    btn: {
      html: `<button class="neon-btn">GOGENIX</button>`,
      css: `.neon-btn { \n  padding: 15px 40px; \n  background: transparent; \n  color: #4285F4; \n  border: 2px solid #4285F4; \n  font-weight: bold; \n  cursor: pointer; \n  transition: 0.3s; \n  box-shadow: 0 0 10px rgba(66,133,244,0.3); \n} \n.neon-btn:hover { \n  background: #4285F4; \n  color: white; \n  box-shadow: 0 0 30px #4285F4; \n}`,
      js: `document.querySelector('.neon-btn').onclick = () => alert('Protocol Active');`
    },
    card: {
      html: `<div class="card">\n  <h3>Intelligence</h3>\n  <p>Secure browser-based computing.</p>\n</div>`,
      css: `body { background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; }\n.card {\n  background: rgba(255,255,255,0.1);\n  backdrop-filter: blur(10px);\n  padding: 30px;\n  border-radius: 20px;\n  border: 1px solid rgba(255,255,255,0.1);\n  color: white;\n  text-align: center;\n}`,
      js: ``
    },
    anim: {
      html: `<div class="circle"></div>`,
      css: `.circle {\n  width: 100px; height: 100px;\n  background: linear-gradient(45deg, #4285F4, #9333ea);\n  border-radius: 50%;\n  position: absolute;\n  animation: move 3s infinite alternate ease-in-out;\n}\n@keyframes move {\n  from { left: 10%; top: 10%; }\n  to { left: 80%; top: 80%; }\n}`,
      js: ``
    },
    reset: { html: '', css: '', js: '' }
  };

  function loadSnippet(key) {
    const s = snippets[key];
    htmlEditor.value = s.html;
    cssEditor.value = s.css;
    jsEditor.value = s.js;
    updatePreview();
  }

  // Set default view
  window.onload = () => loadSnippet('btn');

</script>

</body>
</html>
