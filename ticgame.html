<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebbJamm | Pro Arena</title>
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #9d50bb;
            --accent: #ff007a;
            --bg: #05070a;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.12);
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at center, #10141d 0%, #05070a 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* Arena feel */
        }

        /* --- STARDUST BACKGROUND --- */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: radial-gradient(white 1px, transparent 0);
            background-size: 50px 50px;
            opacity: 0.05;
            z-index: -1;
        }

        header {
            padding: 20px;
            text-align: center;
            z-index: 10;
        }

        .logo { 
            width: 180px; 
            filter: drop-shadow(0 0 15px var(--primary)); 
            animation: breathe 4s ease-in-out infinite;
        }

        @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }

        /* --- MATCH SETUP --- */
        .setup-arena {
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        .config-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        
        label { display: block; font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }

        select {
            width: 100%; padding: 14px; border-radius: 15px;
            background: #161b22; border: 1px solid var(--border);
            color: #fff; font-weight: 700; font-size: 14px;
            transition: 0.3s; appearance: none;
        }
        select:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 210, 255, 0.3); }

        .btn-start {
            width: 100%; padding: 18px; 
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: #fff; border: none; border-radius: 18px;
            font-weight: 900; font-size: 16px; letter-spacing: 1px;
            cursor: pointer; transition: 0.4s;
            text-transform: uppercase;
        }
        .btn-start:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(157, 80, 187, 0.4); }

        /* --- THE BOARD ARENA --- */
        .game-view {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        .status-display {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--primary);
            text-transform: uppercase;
            margin-bottom: 20px;
            background: rgba(0, 210, 255, 0.1);
            padding: 10px 30px;
            border-radius: 100px;
            border: 1px solid rgba(0, 210, 255, 0.2);
        }

        .board-container {
            position: relative;
            background: var(--glass);
            padding: 15px;
            border-radius: 35px;
            border: 1px solid var(--border);
            box-shadow: 0 50px 100px rgba(0,0,0,0.5);
            /* This ensures a big board */
            width: min(85vh, 90vw);
            max-width: 600px;
            aspect-ratio: 1;
        }

        #board {
            display: grid;
            gap: 12px;
            width: 100%;
            height: 100%;
        }

        .cell {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2rem, 10vw, 4rem);
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #fff;
        }

        .cell:hover { background: rgba(255, 255, 255, 0.07); transform: scale(0.98); }
        .cell.taken { cursor: default; }

        .win-glow {
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.3), rgba(157, 80, 187, 0.3)) !important;
            border-color: var(--primary) !important;
            box-shadow: 0 0 30px var(--primary);
            animation: winPulse 1s infinite alternate;
        }

        @keyframes winPulse { from { transform: scale(1); } to { transform: scale(1.05); } }

        /* --- OVERLAYS --- */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 7, 10, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 35px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
        }

        .overlay h2 { font-size: 40px; font-weight: 900; margin-bottom: 20px; background: linear-gradient(to right, #fff, #64748b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .action-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn-action { padding: 12px 25px; border-radius: 12px; border: 1px solid var(--border); background: var(--glass); color: #fff; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-action:hover { background: #fff; color: #000; }

        @media (max-width: 600px) {
            .board-container { padding: 8px; border-radius: 20px; }
            #board { gap: 8px; }
            .cell { border-radius: 12px; }
            .logo { width: 140px; }
        }
    </style>
</head>
<body>

    <header>
        <img src="N-removebg-preview.png" alt="WebbJamm Logo" class="logo">
    </header>

    <div class="setup-arena" id="setup-screen">
        <h2 style="font-size: 14px; letter-spacing: 4px; color: var(--primary); margin-bottom: 10px;">PRO ARENA v2.0</h2>
        <div class="config-row">
            <div style="grid-column: span 2;">
                <label>Battle Type</label>
                <select id="mode">
                    <option value="human">LOCAL MULTIPLAYER (1v1)</option>
                    <option value="cpu">ARTIFICIAL INTEL (vs CPU)</option>
                </select>
            </div>
            <div>
                <label>Arena Size</label>
                <select id="size">
                    <option value="3">CLASSIC (3x3)</option>
                    <option value="4">EXTENDED (4x4)</option>
                    <option value="5">ULTIMATE (5x5)</option>
                </select>
            </div>
            <div>
                <label>Skin</label>
                <select id="theme">
                    <option value="neon">NEON (❌, ⭕)</option>
                    <option value="element">ELEMENTS (🔥, ❄️)</option>
                    <option value="cyber">CYBER (🤖, 👾)</option>
                </select>
            </div>
        </div>
        <button class="btn-start" onclick="initArena()">Initialize Match</button>
    </div>

    <div class="game-view" id="game-screen">
        <div class="status-display" id="status-text">INITIALIZING...</div>
        
        <div class="board-container">
            <div id="board"></div>
            
            <div class="overlay" id="end-overlay">
                <h2 id="result-text">MATCH OVER</h2>
                <div class="action-btns">
                    <button class="btn-action" onclick="resetBoard()">REMATCH</button>
                    <button class="btn-action" onclick="location.reload()">LOBBY</button>
                </div>
            </div>
        </div>

        <p style="margin-top: 30px; font-size: 10px; color: #475569; letter-spacing: 1px;">WEBJAMM PRO ENGINE • RANCHI SECURE</p>
    </div>

    <script>
        let board = [], size = 3, isActive = false;
        let p1, p2, turn, isCPU;

        const themes = {
            neon: ["❌", "⭕"],
            element: ["🔥", "❄️"],
            cyber: ["🤖", "👾"]
        };

        function initArena() {
            size = parseInt(document.getElementById('size').value);
            isCPU = document.getElementById('mode').value === 'cpu';
            const themeKeys = document.getElementById('theme').value;
            [p1, p2] = themes[themeKeys];
            
            turn = p1;
            board = Array(size * size).fill("");
            
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            
            buildGrid();
            updateStatus();
            isActive = true;
        }

        function buildGrid() {
            const grid = document.getElementById('board');
            grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
            grid.innerHTML = "";
            
            for(let i=0; i < size*size; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.setAttribute('data-index', i);
                cell.onclick = () => playerMove(i);
                grid.appendChild(cell);
            }
        }

        function playerMove(i) {
            if(!isActive || board[i] !== "" || (isCPU && turn === p2)) return;
            executeMove(i);
        }

        function executeMove(i) {
            board[i] = turn;
            const cells = document.querySelectorAll('.cell');
            cells[i].innerText = turn;
            cells[i].classList.add('taken');
            
            const winLine = checkWinner();
            if(winLine) {
                endGame(`${turn} VICTORIOUS`, winLine);
                return;
            }
            
            if(!board.includes("")) {
                endGame("DRAW", null);
                return;
            }

            turn = (turn === p1) ? p2 : p1;
            updateStatus();

            if(isCPU && turn === p2) {
                setTimeout(cpuBrain, 600);
            }
        }

        function cpuBrain() {
            if(!isActive) return;
            // 1. Can CPU Win? 2. Can CPU Block? 3. Random
            let move = findBest(p2) || findBest(p1) || randomMove();
            executeMove(move);
        }

        function findBest(sign) {
            const lines = getLines();
            for(let line of lines) {
                const vals = line.map(idx => board[idx]);
                const emptyIdx = line.find(idx => board[idx] === "");
                if(vals.filter(v => v === sign).length === size-1 && emptyIdx !== undefined) return emptyIdx;
            }
            return null;
        }

        function randomMove() {
            const available = board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
            return available[Math.floor(Math.random() * available.length)];
        }

        function getLines() {
            const lines = [];
            for (let i = 0; i < size; i++) {
                let row = [], col = [];
                for (let j = 0; j < size; j++) {
                    row.push(i * size + j);
                    col.push(j * size + i);
                }
                lines.push(row, col);
            }
            let d1 = [], d2 = [];
            for (let i = 0; i < size; i++) {
                d1.push(i * size + i);
                d2.push(i * size + (size - 1 - i));
            }
            lines.push(d1, d2);
            return lines;
        }

        function checkWinner() {
            const lines = getLines();
            for(let line of lines) {
                if(line.every(idx => board[idx] === turn)) return line;
            }
            return null;
        }

        function updateStatus() {
            const label = (isCPU && turn === p2) ? "CPU THINKING..." : `TURN: ${turn}`;
            document.getElementById('status-text').innerText = label;
        }

        function endGame(msg, line) {
            isActive = false;
            if(line) {
                const cells = document.querySelectorAll('.cell');
                line.forEach(idx => cells[idx].classList.add('win-glow'));
            }
            setTimeout(() => {
                document.getElementById('result-text').innerText = msg;
                document.getElementById('end-overlay').style.display = 'flex';
            }, 800);
        }

        function resetBoard() {
            board = Array(size * size).fill("");
            turn = p1;
            isActive = true;
            document.getElementById('end-overlay').style.display = 'none';
            document.querySelectorAll('.cell').forEach(c => {
                c.innerText = "";
                c.classList.remove('win-glow', 'taken');
            });
            updateStatus();
        }
    </script>
</body>
</html>
