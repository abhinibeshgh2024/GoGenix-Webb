<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebbJamm | Series Arena</title>
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #9d50bb;
            --bg: #05070a;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.12);
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            height: 100vh;
            width: 100vw;
            background: radial-gradient(circle at center, #10141d 0%, #05070a 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* Prevents unwanted scrolling */
        }

        /* --- HEADER & SCORE --- */
        header { padding: 15px; text-align: center; flex-shrink: 0; }
        .logo { width: 120px; filter: drop-shadow(0 0 10px var(--primary)); }

        .scoreboard {
            display: none;
            gap: 20px;
            background: var(--glass);
            padding: 10px 25px;
            border-radius: 100px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        /* --- CONFIG SCREEN --- */
        .setup-arena {
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 30px;
            width: 90%;
            max-width: 450px;
            margin: auto;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
        label { display: block; font-size: 9px; color: #64748b; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        
        select {
            width: 100%; padding: 12px; border-radius: 12px;
            background: #161b22; border: 1px solid var(--border);
            color: #fff; font-weight: 700; cursor: pointer;
        }

        /* --- THE BOARD ARENA (SCROLL FIX) --- */
        .game-view {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1; /* Takes available space */
            width: 100%;
            padding: 10px;
            overflow: hidden;
        }

        .board-container {
            position: relative;
            background: var(--glass);
            padding: 10px;
            border-radius: 25px;
            border: 1px solid var(--border);
            /* Vital Fix: Fits inside viewport without scrolling */
            width: min(70vh, 90vw); 
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #board {
            display: grid;
            gap: 8px;
            width: 100%;
            height: 100%;
        }

        .cell {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.5rem, 8vh, 3.5rem);
            cursor: pointer;
            transition: 0.2s;
        }

        .cell:hover { background: rgba(255,255,255,0.08); }
        .win-glow { background: var(--primary) !important; color: #000; box-shadow: 0 0 20px var(--primary); }

        /* --- OVERLAYS --- */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 7, 10, 0.95);
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border-radius: 25px;
        }

        .btn-main {
            width: 100%; padding: 15px; border-radius: 15px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: #fff; border: none; font-weight: 900; cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <img src="N-removebg-preview.png" class="logo">
    </header>

    <div class="scoreboard" id="scoreboard">
        <span id="p1-score-label">P1: 0</span>
        <span style="color: var(--secondary)">VS</span>
        <span id="p2-score-label">P2: 0</span>
    </div>

    <div class="setup-arena" id="setup-screen">
        <h2 style="font-size: 14px; letter-spacing: 3px; color: var(--primary);">MATCH SERIES CONFIG</h2>
        <div class="config-grid">
            <div style="grid-column: span 2;">
                <label>Series Length</label>
                <select id="series">
                    <option value="1">SINGLE MATCH</option>
                    <option value="3">BEST OF 3</option>
                    <option value="5">BEST OF 5</option>
                    <option value="7">BEST OF 7</option>
                    <option value="10">BEST OF 10</option>
                </select>
            </div>
            <div>
                <label>Grid Size</label>
                <select id="size">
                    <option value="3">3 x 3</option>
                    <option value="4">4 x 4</option>
                    <option value="5">5 x 5</option>
                </select>
            </div>
            <div>
                <label>Opponent</label>
                <select id="mode">
                    <option value="human">HUMAN</option>
                    <option value="cpu">AI CPU</option>
                </select>
            </div>
        </div>
        <button class="btn-main" onclick="initSeries()">START SERIES</button>
    </div>

    <div class="game-view" id="game-screen">
        <div id="status-text" style="margin-bottom: 10px; font-weight: 800; color: var(--primary);">TURN: X</div>
        <div class="board-container">
            <div id="board"></div>
            <div class="overlay" id="overlay">
                <h2 id="overlay-msg" style="margin-bottom: 20px;">WINNER!</h2>
                <button class="btn-main" id="overlay-btn" style="width: auto; padding: 10px 30px;">NEXT MATCH</button>
            </div>
        </div>
    </div>

    <script>
        let board = [], size = 3, isActive = false;
        let p1 = "❌", p2 = "⭕", turn = p1;
        let p1Score = 0, p2Score = 0, targetWins = 1, isCPU = false;

        function initSeries() {
            size = parseInt(document.getElementById('size').value);
            targetWins = parseInt(document.getElementById('series').value);
            isCPU = document.getElementById('mode').value === 'cpu';
            
            p1Score = 0; p2Score = 0;
            updateScoreboard();

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('scoreboard').style.display = 'flex';
            document.getElementById('game-screen').style.display = 'flex';
            
            startMatch();
        }

        function startMatch() {
            board = Array(size * size).fill("");
            turn = (p1Score + p2Score) % 2 === 0 ? p1 : p2; // Alternate who starts
            isActive = true;
            document.getElementById('overlay').style.display = 'none';
            renderBoard();
            updateStatus();
            if(isCPU && turn === p2) setTimeout(cpuMove, 600);
        }

        function renderBoard() {
            const grid = document.getElementById('board');
            grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
            grid.innerHTML = "";
            for(let i=0; i<size*size; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.onclick = () => handleMove(i);
                grid.appendChild(cell);
            }
        }

        function handleMove(i) {
            if(!isActive || board[i] !== "" || (isCPU && turn === p2)) return;
            makeMove(i);
        }

        function makeMove(i) {
            board[i] = turn;
            document.querySelectorAll('.cell')[i].innerText = turn;
            
            const winLine = checkWin();
            if(winLine) {
                highlight(winLine);
                endMatch(turn);
                return;
            }
            if(!board.includes("")) { endMatch("DRAW"); return; }

            turn = (turn === p1) ? p2 : p1;
            updateStatus();
            if(isCPU && turn === p2 && isActive) setTimeout(cpuMove, 600);
        }

        function endMatch(winner) {
            isActive = false;
            if(winner === p1) p1Score++;
            else if(winner === p2) p2Score++;
            
            updateScoreboard();
            
            setTimeout(() => {
                const overlay = document.getElementById('overlay');
                const msg = document.getElementById('overlay-msg');
                const btn = document.getElementById('overlay-btn');
                overlay.style.display = 'flex';

                if(p1Score >= targetWins || p2Score >= targetWins) {
                    msg.innerText = `SERIES CHAMPION: ${winner}!`;
                    btn.innerText = "NEW SERIES";
                    btn.onclick = () => location.reload();
                } else {
                    msg.innerText = winner === "DRAW" ? "IT'S A DRAW!" : `${winner} WON MATCH!`;
                    btn.innerText = "CONTINUE SERIES";
                    btn.onclick = startMatch;
                }
            }, 800);
        }

        function cpuMove() {
            const available = board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
            const move = available[Math.floor(Math.random() * available.length)];
            if(move !== undefined) makeMove(move);
        }

        function checkWin() {
            const lines = [];
            for(let i=0; i<size; i++) {
                let row=[], col=[];
                for(let j=0; j<size; j++) {
                    row.push(i*size+j); col.push(j*size+i);
                }
                lines.push(row, col);
            }
            let d1=[], d2=[];
            for(let i=0; i<size; i++) { d1.push(i*size+i); d2.push(i*size+(size-1-i)); }
            lines.push(d1, d2);

            for(let line of lines) {
                if(line.every(idx => board[idx] === turn)) return line;
            }
            return null;
        }

        function highlight(line) {
            const cells = document.querySelectorAll('.cell');
            line.forEach(i => cells[i].classList.add('win-glow'));
        }

        function updateScoreboard() {
            document.getElementById('p1-score-label').innerText = `P1: ${p1Score}`;
            document.getElementById('p2-score-label').innerText = `P2: ${p2Score}`;
        }

        function updateStatus() {
            document.getElementById('status-text').innerText = `TURN: ${turn}`;
        }
    </script>
</body>
</html>
