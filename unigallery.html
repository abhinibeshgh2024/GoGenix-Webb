<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Webb | Art Gallery</title>
  
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QXVCXKPVBC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QXVCXKPVBC');
  </script>

  <link rel="icon" type="image/jpeg" sizes="32x32" href="favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg-dark: #080808;
      --google-blue: #4285F4;
      --ms-border: rgba(255, 255, 255, 0.1);
      --glass: rgba(255, 255, 255, 0.03);
      --accent: #c9a4ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, #111827 0%, #080808 100%);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- UNIFIED HEADER --- */
    header {
      padding: 40px 20px;
      text-align: center;
      width: 100%;
    }

    header img {
      width: 180px;
      height: 180px;
      object-fit: contain;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    header h1 {
      font-size: 14px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--google-blue);
      font-weight: 900;
      margin-top: -15px;
    }

    header p { font-size: 11px; color: #475569; letter-spacing: 2px; margin-top: 8px; }

    /* --- CATEGORY NAV --- */
    .nav-wrapper {
      max-width: 1200px;
      margin: 0 auto 30px;
      padding: 0 20px;
    }

    .navbar {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 10px 0;
      scrollbar-width: none;
      justify-content: center;
    }

    .navbar::-webkit-scrollbar { display: none; }

    .navbar button {
      white-space: nowrap;
      padding: 12px 24px;
      border: 1px solid var(--ms-border);
      border-radius: 100px;
      background: var(--glass);
      color: #94a3b8;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: 0.3s;
    }

    .navbar button:hover, .navbar button.active {
      background: var(--google-blue);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 10px 20px rgba(66, 133, 244, 0.3);
    }

    /* --- GALLERY SECTION --- */
    .section {
      max-width: 1300px;
      margin: 0 auto 100px;
      padding: 40px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--ms-border);
      border-radius: 40px;
    }

    .section-header {
      text-align: left;
      margin-bottom: 40px;
      border-left: 4px solid var(--google-blue);
      padding-left: 20px;
    }

    .section h2 { font-size: 24px; letter-spacing: 1px; color: #fff; }
    .section p { font-size: 12px; color: #64748b; margin-top: 5px; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }

    .art-card {
      position: relative;
      border-radius: 25px;
      overflow: hidden;
      aspect-ratio: 4/5;
      cursor: pointer;
      border: 1px solid var(--ms-border);
      transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .art-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.5s;
    }

    .art-card:hover { transform: translateY(-10px); border-color: var(--google-blue); }
    .art-card:hover img { transform: scale(1.1); filter: brightness(0.7); }

    .art-info {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      opacity: 0;
      transition: 0.3s;
    }

    .art-card:hover .art-info { opacity: 1; }

    /* --- MODAL --- */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(10px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 5000;
      padding: 20px;
    }

    .modal-content {
      position: relative;
      max-width: 900px;
      width: 100%;
      text-align: center;
    }

    .modal img {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 20px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    }

    .modal-actions {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 25px;
    }

    .modal-actions button {
      padding: 14px 28px;
      border: none;
      border-radius: 100px;
      background: #fff;
      color: #000;
      font-weight: 800;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.3s;
    }

    .modal-actions button:hover { background: var(--google-blue); color: #fff; }

    .close {
      position: absolute;
      top: -50px;
      right: 0;
      font-size: 40px;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }
    .close:hover { color: var(--google-blue); }

    /* --- MOBILE --- */
    @media (max-width: 600px) {
      .navbar { justify-content: flex-start; padding-left: 20px; }
      .section { padding: 20px; border-radius: 20px; }
      header img { width: 140px; height: 140px; }
    }
  </style>
</head>

<body>

<header>
  <img src="WEBB-removebg-preview.png" alt="Webb Logo">
  <h1>Webb Art Gallery</h1>
  <p>High-fidelity AI-generated visions on demand</p>
</header>

<nav class="nav-wrapper">
  <div class="navbar" id="navbar">
    <button class="active" onclick="loadGallery('all', this)">All Works</button>
    <button onclick="loadGallery('culture', this)">Culture</button>
    <button onclick="loadGallery('tech', this)">Tech & Future</button>
    <button onclick="loadGallery('nature', this)">Deep Nature</button>
    <button onclick="loadGallery('space', this)">Cosmos</button>
    <button onclick="loadGallery('nations', this)">Nations</button>
  </div>
</nav>

<section class="section">
  <div class="section-header">
    <h2 id="sectionTitle">CURATED EXHIBIT</h2>
    <p id="sectionDesc">Browse through our latest high-definition digital generations.</p>
  </div>
  <div class="gallery" id="gallery"></div>
</section>

<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">×</span>
    <img id="modalImg">
    <div class="modal-actions">
      <button onclick="downloadImg('png')"><i class="fa fa-image"></i> PNG</button>
      <button onclick="downloadImg('jpg')"><i class="fa fa-file-image"></i> JPG</button>
      <button onclick="downloadImg('pdf')"><i class="fa fa-file-pdf"></i> PDF Document</button>
    </div>
  </div>
</div>

<script>
const data = {
  culture: ['angkorwat_artgallery_ggwebb.png', 'chinesetemple_ggwebb_artgallery.png'],
  tech: ['laptopart_ai.png', 'tech_handshake_ai.png', 'cyber_city_genix.png'],
  nature: ['everest_sunset_ai.png', 'amazon_biolume.png'],
  space: ['mars_colony_2045.png', 'nebula_dream.png'],
  nations: ['AMERICAnations.png', 'FRANCEnations.png']
};

let currentImg = "";

function loadGallery(cat, btn) {
  // UI update
  document.querySelectorAll('.navbar button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  
  const gallery = document.getElementById("gallery");
  gallery.style.opacity = "0";
  
  setTimeout(() => {
    gallery.innerHTML = "";
    document.getElementById("sectionTitle").innerText = cat === 'all' ? "CURATED EXHIBIT" : cat.toUpperCase();
    
    let items = [];
    if (cat === 'all') {
      Object.values(data).forEach(arr => items = items.concat(arr));
    } else {
      items = data[cat] || [];
    }

    items.forEach(src => {
      const card = document.createElement("div");
      card.className = "art-card";
      card.onclick = () => openModal(src);
      
      card.innerHTML = `
        <img src="${src}" alt="Webb Art" onerror="this.src='https://via.placeholder.com/400x500/111/444?text=IMAGE+PENDING'">
        <div class="art-info">
          <p style="color:#fff; font-weight:800; font-size:10px; letter-spacing:1px;">WEBB GENERATION</p>
          <p style="color:var(--google-blue); font-size:9px;">Click to Export</p>
        </div>
      `;
      gallery.appendChild(card);
    });
    gallery.style.opacity = "1";
  }, 200);
}

function openModal(src) {
  currentImg = src;
  const modal = document.getElementById("modal");
  const modalImg = document.getElementById("modalImg");
  modal.style.display = "flex";
  modalImg.src = src;
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

function downloadImg(type) {
  if (type === "pdf") {
    const { jsPDF } = window.jspdf;
    let doc = new jsPDF('l', 'mm', 'a4'); // Landscape for art
    doc.addImage(currentImg, "JPEG", 10, 10, 277, 190);
    doc.save("Webb_Art_Export.pdf");
  } else {
    let a = document.createElement("a");
    a.href = currentImg;
    a.download = "Webb_Art_" + Date.now() + "." + type;
    a.click();
  }
}

// Initial Load
window.onload = () => {
  loadGallery('all', document.querySelector('.navbar button'));
};
</script>

</body>
</html>
