<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Webb | Whiteboard</title>
  
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QXVCXKPVBC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QXVCXKPVBC');
  </script>

  <link rel="icon" type="image/jpeg" sizes="32x32" href="favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --bg-dark: #080808;
      --google-blue: #4285F4;
      --ms-border: rgba(255, 255, 255, 0.1);
      --glass: rgba(255, 255, 255, 0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; touch-action: none; }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, #111827 0%, #080808 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden; /* Prevent scrolling while drawing */
    }

    /* --- HEADER --- */
    header { padding: 15px; text-align: center; }
    header img { width: 140px; margin-bottom: 5px; }
    header h1 { font-size: 12px; letter-spacing: 4px; text-transform: uppercase; color: var(--google-blue); }

    /* --- TOOLBAR --- */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 15px;
      background: var(--glass);
      backdrop-filter: blur(15px);
      border-top: 1px solid var(--ms-border);
      border-bottom: 1px solid var(--ms-border);
      z-index: 100;
    }

    .tool-group { display: flex; gap: 5px; border-right: 1px solid var(--ms-border); padding-right: 10px; margin-right: 5px; }

    button {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--ms-border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    button.active { background: var(--google-blue); border-color: transparent; }
    button:hover { background: rgba(255,255,255,0.15); }

    input[type="color"] { width: 40px; height: 38px; border: none; background: none; cursor: pointer; }

    /* --- BOARD --- */
    .main-canvas-area {
      flex: 1;
      position: relative;
      background: #fff;
      margin: 15px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #gridCanvas { opacity: 0.1; pointer-events: none; }

    footer {
      text-align: center;
      padding: 10px;
      font-size: 9px;
      letter-spacing: 2px;
      color: #475569;
      text-transform: uppercase;
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
      .tool-group { border: none; padding: 0; margin: 0; }
      header img { width: 100px; }
    }
  </style>
</head>

<body>

<header>
  <img src="WEBB-removebg-preview.png">
  <h1>Webb Whiteboard</h1>
</header>

<div class="toolbar">
  <div class="tool-group">
    <button onclick="setTool('pen', this)" class="active"><i class="fa fa-pen"></i></button>
    <button onclick="setTool('marker', this)"><i class="fa fa-highlighter"></i></button>
    <button onclick="setTool('eraser', this)"><i class="fa fa-eraser"></i></button>
  </div>
  
  <div class="tool-group">
    <button onclick="setTool('rect', this)"><i class="fa fa-square"></i></button>
    <button onclick="setTool('circle', this)"><i class="fa fa-circle"></i></button>
    <button onclick="toggleGrid()"><i class="fa fa-th"></i></button>
  </div>

  <input type="color" id="colorPicker" value="#000000">
  <input type="range" id="thickness" min="1" max="25" value="3" style="width:80px">

  <button onclick="clearBoard()"><i class="fa fa-trash"></i></button>
  <button onclick="exportPDF()" style="background: #fff; color: #000; font-weight: 800;">EXPORT PDF</button>
</div>

<div class="main-canvas-area" id="exportArea">
  <canvas id="gridCanvas"></canvas>
  <canvas id="mainCanvas"></canvas>
  <canvas id="tempCanvas"></canvas> </div>

<footer>Built with discipline & correctness</footer>

<script>
  const mainCanvas = document.getElementById("mainCanvas");
  const tempCanvas = document.getElementById("tempCanvas");
  const gridCanvas = document.getElementById("gridCanvas");
  
  const ctx = mainCanvas.getContext("2d");
  const tctx = tempCanvas.getContext("2d");
  const gctx = gridCanvas.getContext("2d");

  let drawing = false;
  let tool = "pen";
  let startX, startY;
  let color = "#000000";
  let thickness = 3;
  let gridVisible = false;

  function resize() {
    const parent = mainCanvas.parentElement;
    [mainCanvas, tempCanvas, gridCanvas].forEach(c => {
      c.width = parent.clientWidth;
      c.height = parent.clientHeight;
    });
    if(gridVisible) drawGrid();
  }

  window.addEventListener('resize', resize);
  resize();

  /* CONTROLS */
  document.getElementById("colorPicker").oninput = e => color = e.target.value;
  document.getElementById("thickness").oninput = e => thickness = e.target.value;

  function setTool(t, btn) {
    tool = t;
    document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function toggleGrid() {
    gridVisible = !gridVisible;
    gridVisible ? drawGrid() : gctx.clearRect(0,0,gridCanvas.width, gridCanvas.height);
  }

  function drawGrid() {
    gctx.clearRect(0,0,gridCanvas.width, gridCanvas.height);
    gctx.strokeStyle = "#000";
    gctx.lineWidth = 0.5;
    for(let i=0; i<gridCanvas.width; i+=30) {
      gctx.beginPath(); gctx.moveTo(i,0); gctx.lineTo(i, gridCanvas.height); gctx.stroke();
    }
    for(let i=0; i<gridCanvas.height; i+=30) {
      gctx.beginPath(); gctx.moveTo(0,i); gctx.lineTo(gridCanvas.width, i); gctx.stroke();
    }
  }

  /* UNIFIED INPUT (Mouse & Touch) */
  function getPos(e) {
    const rect = mainCanvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function startDrawing(e) {
    drawing = true;
    const pos = getPos(e);
    startX = pos.x;
    startY = pos.y;
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    e.preventDefault();
  }

  function draw(e) {
    if (!drawing) return;
    const pos = getPos(e);
    tctx.clearRect(0, 0, tempCanvas.width, tempCanvas.height); // Clear preview

    if (tool === "pen" || tool === "marker") {
      ctx.globalAlpha = tool === "marker" ? 0.3 : 1;
      ctx.strokeStyle = color;
      ctx.lineWidth = tool === "marker" ? thickness * 3 : thickness;
      ctx.lineCap = "round";
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    } 
    else if (tool === "rect") {
      tctx.strokeStyle = color;
      tctx.lineWidth = thickness;
      tctx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
    } 
    else if (tool === "circle") {
      tctx.strokeStyle = color;
      tctx.lineWidth = thickness;
      const r = Math.hypot(pos.x - startX, pos.y - startY);
      tctx.beginPath();
      tctx.arc(startX, startY, r, 0, Math.PI * 2);
      tctx.stroke();
    } 
    else if (tool === "eraser") {
      ctx.clearRect(pos.x - 15, pos.y - 15, 30, 30);
    }
  }

  function stopDrawing(e) {
    if (!drawing) return;
    const pos = getPos(e);
    
    // Bake temporary shape into main canvas
    if (tool === "rect") {
      ctx.strokeStyle = color;
      ctx.lineWidth = thickness;
      ctx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
    } else if (tool === "circle") {
      ctx.strokeStyle = color;
      ctx.lineWidth = thickness;
      const r = Math.hypot(pos.x - startX, pos.y - startY);
      ctx.beginPath();
      ctx.arc(startX, startY, r, 0, Math.PI * 2);
      ctx.stroke();
    }
    
    tctx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
    drawing = false;
  }

  // Event Listeners
  [tempCanvas].forEach(c => {
    c.addEventListener("mousedown", startDrawing);
    c.addEventListener("mousemove", draw);
    window.addEventListener("mouseup", stopDrawing);
    
    c.addEventListener("touchstart", startDrawing);
    c.addEventListener("touchmove", draw);
    c.addEventListener("touchend", stopDrawing);
  });

  function clearBoard() {
    ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
  }

  function exportPDF() {
    const element = document.getElementById("exportArea");
    html2pdf().from(element).set({
      margin: 0,
      filename: "Webb_Board_Export.pdf",
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: "in", format: "a4", orientation: "landscape" }
    }).save();
  }
</script>

</body>
</html>
