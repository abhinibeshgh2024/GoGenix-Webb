<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GoGenix Webb | UniPlat 2.0</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #080808;
      --google-blue: #4285F4;
      --google-red: #EA4335;
      --google-yellow: #FBBC05;
      --google-green: #34A853;
      --ms-border: rgba(255, 255, 255, 0.1);
      --glass: rgba(255, 255, 255, 0.03);
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, #670067 0%, #8C1946 100%);
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: absolute; 
      width: 100%;
      top: 0;
      z-index: 1000;
      background: transparent; 
    }

    .logo img {
      width: 180px; 
      height: 180px;
      object-fit: contain;
      filter: drop-shadow(0 0 15px rgba(255,255,255,0.05));
    }

    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-top: 220px; /* Adjusted for the 180px logo */
    }

    .version-badge {
      text-align: center;
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--google-blue);
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 25px;
    }

    nav {
      text-align: center;
      padding: 0 5%;
    }

    .brand-text {
      /* Adjusted clamp to ensure one-line stays perfectly centered and small enough for phones */
      font-size: clamp(10px, 3.8vw, 36px); 
      font-weight: 800;
      margin-bottom: 45px;
      white-space: nowrap; 
      display: flex;
      justify-content: center;
      gap: 1.5vw;
    }

    .brand-text span:nth-child(1) { color: var(--google-blue); }
    .brand-text span:nth-child(2) { color: var(--google-red); }
    .brand-text span:nth-child(3) { color: var(--google-yellow); }
    .brand-text span:nth-child(4) { color: var(--google-green); }

    .nav-button-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 60px;
    }

    .capsule-btn {
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 30px;
      min-width: 180px;
      border-radius: 50px;
      background: var(--glass);
      border: 1px solid var(--ms-border);
      backdrop-filter: blur(10px);
      transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .capsule-btn img {
      width: 28px;
      height: 28px;
    }

    .capsule-btn span {
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    .capsule-btn:hover {
      transform: translateY(-5px);
      border-color: var(--google-blue);
      box-shadow: 0 10px 25px rgba(66, 133, 244, 0.2);
      background: rgba(255, 255, 255, 0.05);
    }

    /* --- DASHBOARD: ADDED GAPS AND PADDING --- */
    .visitor-dashboard {
      max-width: 900px;
      width: 90%;
      margin: 20px auto;
      padding: 40px 20px;
      background: rgba(255,255,255,0.02);
      border-radius: 24px;
      border: 1px solid var(--ms-border);
    }

    .stats-grid {
      display: flex;
      justify-content: space-evenly; /* Better distribution */
      align-items: center;
      gap: 20px; /* Space between items */
    }

    .stat-item { 
      text-align: center;
      padding: 10px; /* Internal spacing */
      flex: 1; /* Ensures equal width to prevent touching */
    }

    .stat-item h3 { 
      font-size: clamp(18px, 4vw, 32px); 
      font-weight: 800; 
      margin-bottom: 8px; 
    }

    .stat-item p { 
      font-size: clamp(9px, 1.5vw, 11px); 
      color: #94a3b8; 
      text-transform: uppercase; 
      letter-spacing: 1px;
    }

    .stat-blue { color: var(--google-blue); }
    .stat-red { color: var(--google-red); }
    .stat-yellow { color: var(--google-yellow); }
    .stat-green { color: var(--google-green); }

    .footer-box {
      text-align: center;
      padding: 50px 20px;
      border-top: 1px solid var(--ms-border);
      margin-top: auto;
    }

    .footer-logo {
      width: 200px;
      margin-bottom: 25px;
      opacity: 0.8;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .social-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--glass);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
      border: 1px solid var(--ms-border);
      transition: 0.3s;
    }

    .social-icon:hover { background: #fff; color: #000; transform: scale(1.1); }

    footer { padding: 25px; text-align: center; font-size: 10px; color: #475569; letter-spacing: 1px; }

    @media (max-width: 600px) {
      main { justify-content: space-around; } 
      .nav-button-container { gap: 10px; }
      .capsule-btn { padding: 12px 18px; min-width: 145px; }
      .capsule-btn span { font-size: 13px; }
      .stats-grid { gap: 10px; } /* Slightly smaller gaps on tiny screens */
      .stat-item { padding: 5px; }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      <img src="WEBB-removebg-preview.png" alt="GoGenix Logo">
    </div>
  </header>

  <main>
    <div class="version-badge">UniPlat 2.0</div>

    <nav>
      <h1 class="brand-text">
        <span>Unified.</span> <span>Powerful.</span> <span>Free.</span> <span>Productive.</span>
      </h1>
      
      <div class="nav-button-container">
        <a href="webbtab.html" class="capsule-btn">
          <img src="UniPlat.-removebg-preview.png" alt="GenixTab">
          <span>GenixTab</span>
        </a>

        <a href="webbgames.html" class="capsule-btn">
          <img src="N-removebg-preview.png" alt="WebbJamm">
          <span>WebbJamm</span>
        </a>
      </div>
    </nav>

    <section class="visitor-dashboard">
      <div class="stats-grid">
          <div class="stat-item">
              <h3 class="stat-blue">320</h3>
              <p>Users</p>
          </div>
          <div class="stat-item">
              <h3 class="stat-red">20+</h3>
              <p>Cities</p>
          </div>
          <div class="stat-item">
              <h3 class="stat-yellow">15+</h3>
              <p>Countries</p>
          </div>
          <div class="stat-item">
              <h3 class="stat-green">2</h3>
              <p>Tabs</p>
          </div>
      </div>
    </section>
  </main>

  <div class="footer-box">
    <img src="UNITED_PLATFORM__4_-removebg-preview.png" alt="Footer Logo" class="footer-logo">
    <div class="social-links">
        <a href="https://linkedin.com/..." class="social-icon"><i class="fab fa-linkedin-in"></i></a>
        <a href="https://instagram.com/..." class="social-icon"><i class="fab fa-instagram"></i></a>
    </div>
  </div>

  <footer>
    <p>© 2026 GOGENIX WEBB | UNIFIED PLATFORM SYSTEM</p>
  </footer>

</body>
</html>
