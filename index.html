<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QXVCXKPVBC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QXVCXKPVBC');
  </script>
  
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <title>GoGenix Webb | UniPlat 2.0</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --ms-dark: #050505;
      --ms-card: rgba(255, 255, 255, 0.03);
      --google-blue: #4285F4;
      --google-red: #EA4335;
      --google-yellow: #FBBC05;
      --google-green: #34A853;
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--ms-dark);
      background-image: radial-gradient(circle at 50% -10%, #1e293b 0%, #050505 100%);
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
    }

    /* --- HEADER: BIG & CLEAR LOGOS --- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 6%;
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(5, 5, 5, 0.7);
    }

    .logo img, .right-logo img {
      height: 65px; /* Increased size for clarity */
      width: auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.1));
      transition: transform 0.4s ease;
    }

    .logo img:hover, .right-logo img:hover {
      transform: scale(1.05);
    }

    /* --- VERSION TAG --- */
    .version-tag {
      text-align: center;
      margin-top: 20px;
    }

    .version-badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--google-blue);
      color: var(--google-blue);
      padding: 5px 15px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      display: inline-block;
      box-shadow: 0 0 15px rgba(66, 133, 244, 0.2);
    }

    /* --- MAIN NAVIGATION --- */
    nav { padding: 60px 20px 40px; text-align: center; }

    .page-title {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 40px;
      background: linear-gradient(to bottom, #fff 30%, #64748b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-button-container {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .img-nav-btn {
      position: relative;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      width: 240px;
      border-radius: 35px;
      background: var(--ms-card);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .img-nav-btn img {
      width: 90px;
      height: auto;
      margin-bottom: 20px;
    }

    .img-nav-btn span {
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 2px;
      font-size: 14px;
    }

    .img-nav-btn:hover {
      transform: translateY(-10px);
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--google-blue);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    /* --- INTEGRATED DASHBOARD SECTION --- */
    .dashboard-section {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .dash-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 30px;
      transition: 0.3s;
    }

    .dash-card:hover {
      border-color: rgba(255,255,255,0.3);
      transform: scale(1.02);
    }

    .dash-card h3 {
      font-size: 18px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dash-card i { color: var(--google-green); }

    /* --- FOOTER --- */
    .footer-box {
      padding: 80px 20px;
      text-align: center;
      border-top: 1px solid var(--glass-border);
      margin-top: 60px;
    }

    .footer-logo-center {
      width: 320px; /* Large Footer Logo */
      height: auto;
      margin-bottom: 30px;
      filter: drop-shadow(0 0 20px rgba(255,255,255,0.1));
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .social-btn {
      width: 55px;
      height: 55px;
      border-radius: 18px;
      background: var(--ms-card);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 22px;
      transition: 0.4s;
      text-decoration: none;
    }

    .social-btn:hover {
      transform: translateY(-5px);
      background: var(--google-blue);
    }

    footer {
      padding: 30px;
      text-align: center;
      font-size: 11px;
      color: #475569;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      header { padding: 15px 4%; }
      .logo img, .right-logo img { height: 45px; }
      .img-nav-btn { width: 100%; }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      <img src="WEBB-removebg-preview.png" alt="GoGenix Logo">
    </div>
    <div class="right-logo">
      <img src="UniPlat.-removebg-preview.png" alt="United Platform">
    </div>
  </header>

  <div class="version-tag">
    <span class="version-badge">UniPlat 2.0</span>
  </div>

  <nav>
    <h1 class="page-title">Productivity Without Barriers.</h1>
    
    <div class="nav-button-container">
      <a href="webbtab.html" class="img-nav-btn">
        <img src="UniPlat.-removebg-preview.png" alt="GenixTab">
        <span>GenixTab</span>
      </a>

      <a href="webbgames.html" class="img-nav-btn">
        <img src="N-removebg-preview.png" alt="WebbJamm">
        <span>WebbJamm</span>
      </a>
    </div>
  </nav>

  <section class="dashboard-section">
    <div class="dashboard-grid">
      <div class="dash-card">
        <h3><i class="fas fa-bolt"></i> Quick Start</h3>
        <p style="color: #94a3b8; font-size: 14px;">Access your most used tools instantly without navigation lag.</p>
      </div>
      <div class="dash-card">
        <h3><i class="fas fa-shield-alt"></i> Privacy Mode</h3>
        <p style="color: #94a3b8; font-size: 14px;">No data logging enabled. Your session is temporary and secure.</p>
      </div>
    </div>
  </section>

  <div class="footer-box">
    <img src="UNITED_PLATFORM__4_-removebg-preview.png" alt="Logo" class="footer-logo-center">
    
    <div class="social-links">
        <a href="https://www.linkedin.com/company/gogenixwebb" class="social-btn" target="_blank">
            <i class="fab fa-linkedin-in"></i>
        </a>
        <a href="https://www.instagram.com/gogenix_weser/" class="social-btn" target="_blank">
            <i class="fab fa-instagram"></i>
        </a>
    </div>
  </div>

  <footer>
    <p>© 2026 GOGENIX WEBB | UNIPLAT 2.0 BY GOGENIX WESER</p>
  </footer>

</body>
</html>
