<head>

    gtag('js', new Date());
    gtag('config', 'G-QXVCXKPVBC');

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --ms-dark: #0a0a0a;
      --ms-card: rgba(255, 255, 255, 0.03);
      --google-blue: #4285F4;
      --google-red: #EA4335;
      --google-yellow: #FBBC05;
      --google-green: #34A853;
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--ms-dark);
      background-image: radial-gradient(circle at 50% -20%, #1e293b 0%, #0a0a0a 80%);
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* --- HEADER: FIXING LOGO SQUEEZE --- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 5%;
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo img, .right-logo img {
      height: 45px; /* Control height only */
      width: auto;   /* Allow width to scale naturally */
      display: block;
      object-fit: contain; /* Prevents stretching */
      transition: transform 0.3s ease;
    }

    /* --- INNOVATIVE BUTTONS --- */
    nav {
      padding: 100px 20px 60px;
      text-align: center;
    }

    .page-title {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 800;
      background: linear-gradient(to right, #ffffff, #64748b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 50px;
    }

    .nav-button-container {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
    }

    .img-nav-btn {
      position: relative;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 45px 35px;
      width: 220px;
      border-radius: 30px;
      background: var(--ms-card);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Animated Glow Border */
    .img-nav-btn::before {
      content: '';
      position: absolute;
      inset: -1px;
      padding: 2px;
      border-radius: 30px;
      background: linear-gradient(45deg, var(--google-blue), var(--google-red), var(--google-yellow), var(--google-green));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .img-nav-btn:hover::before { opacity: 1; }

    .img-nav-btn img {
      width: 85px;  /* Fixed width */
      height: auto; /* Auto height to prevent squeezing */
      margin-bottom: 25px;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .img-nav-btn span {
      color: #94a3b8;
      font-weight: 700;
      letter-spacing: 2px;
      font-size: 13px;
      text-transform: uppercase;
    }

    .img-nav-btn:hover {
      transform: translateY(-15px) scale(1.03);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
    }

    .img-nav-btn:hover img {
      transform: scale(1.15) rotate(5deg);
    }

    .img-nav-btn:hover span {
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    /* --- ABOUT SECTION --- */
    .about-section { padding: 40px 5%; }
    .about-card {
      background: var(--ms-card);
      border: 1px solid var(--glass-border);
      padding: 50px;
      border-radius: 32px;
      max-width: 850px;
      margin: 0 auto;
      backdrop-filter: blur(10px);
    }

    /* --- FOOTER: FIXING FOOTER LOGO --- */
    .footer-box {
      padding: 100px 20px;
      text-align: center;
      border-top: 1px solid var(--glass-border);
    }

    .footer-logo-center {
      width: 100%;
      max-width: 280px; /* Bigger and fixed max-width */
      height: auto;     /* Maintains aspect ratio */
      margin-bottom: 30px;
      opacity: 0.8;
      transition: 0.5s ease;
    }

    .footer-logo-center:hover {
      opacity: 1;
      transform: scale(1.05);
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-top: 35px;
    }

    .social-btn {
      width: 60px;
      height: 60px;
      border-radius: 20px; /* Modern Squircle shape */
      background: var(--ms-card);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 24px;
      text-decoration: none;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .social-btn:hover {
      transform: translateY(-10px) rotate(8deg);
      color: #fff;
    }

    .social-btn.linkedin:hover { background: #0077b5; box-shadow: 0 15px 30px rgba(0, 119, 181, 0.4); }
    .social-btn.instagram:hover { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%,#d6249f 60%,#285AEB 90%); box-shadow: 0 15px 30px rgba(214, 36, 159, 0.4); }

    footer {
      padding: 40px;
      background: #050505;
      color: #475569;
      font-size: 12px;
      text-align: center;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      header { padding: 10px 5%; }
      .logo img, .right-logo img { height: 35px; }
      .img-nav-btn { width: 100%; max-width: 280px; }
    }
  </style>
</head>

<body>

  <nav>

  <section class="about-section">

      <p>GoGenix Webb is a unified platform built for <b>high-performance utility</b>. By removing the friction of sign-ups and premium paywalls, we’ve created a direct path to the tools you need.</p>

  </div>

  <footer>
