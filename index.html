<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GoGenix Webb | UniPlat 2.0 Tactical</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        
        :root {
            /* Lighter NATO Blue for contrast against Metallic Black */
            --nato-light: #7dd3fc; 
            --nato-muted: #38bdf8;
            --metallic-black: #0f172a;
        }

        body {
            font-family: 'Inter', sans-serif;
            /* Metallic Black Gradient */
            background: linear-gradient(135deg, #020617 0%, #1e293b 50%, #020617 100%);
            color: var(--nato-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Shimmering Text Animation */
        .brand-shimmer {
            background: linear-gradient(90deg, #7dd3fc, #ffffff, #7dd3fc);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            to { background-position: 200% center; }
        }

        /* Tactical Capsule Buttons - Metallic Stealth Style */
        .capsule-btn {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(125, 211, 252, 0.2);
            backdrop-filter: blur(10px);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .capsule-btn:hover {
            transform: scale(1.02);
            border-color: var(--nato-light);
            background: rgba(125, 211, 252, 0.1);
            box-shadow: 0 0 20px rgba(125, 211, 252, 0.15);
        }

        /* Stats Section - Metallic Panel */
        .metallic-panel {
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid rgba(125, 211, 252, 0.1);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .status-pulse {
            width: 8px;
            height: 8px;
            background: #7dd3fc;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 10px #7dd3fc;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>
</head>
<body class="selection:bg-sky-500 selection:text-white">
