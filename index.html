<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GoGenix Webb | UniPlat 2.0</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #080808;
      --google-blue: #4285F4;
      --google-red: #EA4335;
      --google-yellow: #FBBC05;
      --google-green: #34A853;
      --ms-border: rgba(255, 255, 255, 0.1);
      --glass: rgba(255, 255, 255, 0.03);
    }

    /* Prevent horizontal scrolling and force fit */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, #111827 0%, #080808 100%);
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* --- FIXED RATIO HEADER --- */
    header {
      display: flex;
      justify-content: center; /* Centering the single logo */
      align-items: center;
      padding: 1.5vw 5vw;
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(8, 8, 8, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--ms-border);
    }

    .logo img {
      height: 5vw; /* Scales perfectly with screen width */
      min-height: 40px;
      width: auto;
      object-fit: contain;
    }

    .version-badge {
      text-align: center;
      margin: 2vw 0;
      font-size: 0.8vw;
      min-size: 10px;
      letter-spacing: 0.3vw;
      color: var(--google-blue);
      font-weight: 900;
      text-transform: uppercase;
    }

    /* --- ALIGNMENT & SCALE ENGINE --- */
    nav {
      padding: 2vw 5vw;
      text-align: center;
    }

    .brand-text {
      font-size: 3.5vw; /* Fluid typography */
      font-weight: 800;
      margin-bottom: 3vw;
      letter-spacing: -0.1vw;
    }

    .brand-text span:nth-child(1) { color: var(--google-blue); }
    .brand-text span:nth-child(2) { color: var(--google-red); }
    .brand-text span:nth-child(3) { color: var(--google-yellow); }
    .brand-text span:nth-child(4) { color: var(--google-green); }

    /* CAPSULE BUTTONS: FIXED SIDE-BY-SIDE */
    .nav-button-container {
      display: flex;
      justify-content: center;
      gap: 2vw;
      flex-wrap: nowrap; /* Forces side-by-side even on mobile */
    }

    .capsule-btn {
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1vw;
      padding: 1.2vw 3vw;
      width: 22vw; /* Proportionate width */
      border-radius: 100px;
      background: var(--glass);
      border: 1px solid var(--ms-border);
      backdrop-filter: blur(10px);
      transition: 0.4s ease;
    }

    .capsule-btn img {
      width: 3vw;
      height: 3vw;
      min-width: 20px;
      min-height: 20px;
    }

    .capsule-btn span {
      color: #fff;
      font-weight: 600;
      font-size: 1.1vw; /* Text scales with screen */
    }

    .capsule-btn:hover {
      transform: translateY(-5px);
      border-color: var(--google-blue);
      background: rgba(66, 133, 244, 0.1);
    }

    /* --- STATS DASHBOARD --- */
    .visitor-dashboard {
      max-width: 80vw;
      margin: 5vw auto;
      padding: 3vw;
      background: rgba(255,255,255,0.02);
      border-radius: 2vw;
      border: 1px solid var(--ms-border);
    }

    .stats-grid {
      display: flex; /* Linear row for all resolutions */
      justify-content: space-around;
      align-items: center;
    }

    .stat-item { text-align: center; }

    .stat-item h3 {
      font-size: 2.5vw;
      font-weight: 800;
      margin-bottom: 0.5vw;
    }

    .stat-item p {
      font-size: 0.8vw;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .stat-blue { color: var(--google-blue); }
    .stat-red { color: var(--google-red); }
    .stat-yellow { color: var(--google-yellow); }
    .stat-green { color: var(--google-green); }

    /* --- FOOTER --- */
    .footer-box {
      text-align: center;
      padding: 4vw 5vw;
      border-top: 1px solid var(--ms-border);
    }

    .footer-logo {
      width: 15vw;
      margin-bottom: 2vw;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 2vw;
    }

    .social-icon {
      width: 3.5vw;
      height: 3.5vw;
      min-width: 35px;
      min-height: 35px;
      border-radius: 50%;
      background: var(--glass);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
      border: 1px solid var(--ms-border);
    }

    footer p {
      font-size: 0.7vw;
      color: #475569;
      padding: 2vw;
      text-align: center;
    }

    /* Mobile specific overrides to keep font readable but layout identical */
    @media (max-width: 600px) {
      .brand-text { font-size: 6vw; }
      .capsule-btn span { font-size: 2.5vw; }
      .stat-item h3 { font-size: 4vw; }
      .stat-item p { font-size: 1.5vw; }
      footer p { font-size: 2vw; }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      <img src="WEBB-removebg-preview.png" alt="GoGenix Logo">
    </div>
  </header>

  <div class="version-badge">UniPlat 2.0</div>

  <nav>
    <h1 class="brand-text">
      <span>Unified.</span> <span>Powerful.</span> <span>Free.</span> <span>Productive.</span>
    </h1>
    
    <div class="nav-button-container">
      <a href="webbtab.html" class="capsule-btn">
        <img src="UniPlat.-removebg-preview.png" alt="GenixTab">
        <span>GenixTab</span>
      </a>

      <a href="webbgames.html" class="capsule-btn">
        <img src="N-removebg-preview.png" alt="WebbJamm">
        <span>WebbJamm</span>
      </a>
    </div>
  </nav>

  <section class="visitor-dashboard">
    <div class="stats-grid">
        <div class="stat-item">
            <h3 class="stat-blue">320</h3>
            <p>Active Users</p>
        </div>
        <div class="stat-item">
            <h3 class="stat-red">20+</h3>
            <p>Cities</p>
        </div>
        <div class="stat-item">
            <h3 class="stat-yellow">15+</h3>
            <p>Countries</p>
        </div>
        <div class="stat-item">
            <h3 class="stat-green">2</h3>
            <p>Main Tabs</p>
        </div>
    </div>
  </section>

  <div class="footer-box">
    <img src="UNITED_PLATFORM__4_-removebg-preview.png" alt="Footer Logo" class="footer-logo">
    <div class="social-links">
        <a href="https://linkedin.com/..." class="social-icon"><i class="fab fa-linkedin-in"></i></a>
        <a href="https://instagram.com/..." class="social-icon"><i class="fab fa-instagram"></i></a>
    </div>
</div>

<footer>
    <p>© 2026 GOGENIX WEBB | UNIFIED PLATFORM SYSTEM</p>
</footer>

</body>
</html>
