<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QXVCXKPVBC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QXVCXKPVBC');
  </script>
  
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <title>GoGenix Webb | UniPlat 2.0</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #080808;
      --google-blue: #4285F4;
      --google-red: #EA4335;
      --google-yellow: #FBBC05;
      --google-green: #34A853;
      --ms-border: rgba(255, 255, 255, 0.08);
      --glass: rgba(255, 255, 255, 0.03);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, #111827 0%, #080808 100%);
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    /* --- HEADER: SAME AS BODY + OPACITY --- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 6%;
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(8, 8, 8, 0.85); /* Same as body but with opacity */
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--ms-border);
    }

    .logo img, .right-logo img {
      height: 70px; /* Big and Clear */
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 15px rgba(255,255,255,0.1));
    }

    .version-badge {
      display: block;
      text-align: center;
      margin: 20px 0;
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--google-blue);
      font-weight: 900;
      text-transform: uppercase;
    }

    nav { padding: 40px 20px; text-align: center; }

    /* --- MULTI-COLOR GOOGLE/MS TEXT --- */
    .brand-text {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      margin-bottom: 50px;
      letter-spacing: -2px;
    }

    .brand-text span:nth-child(1) { color: var(--google-blue); }
    .brand-text span:nth-child(2) { color: var(--google-red); }
    .brand-text span:nth-child(3) { color: var(--google-yellow); }
    .brand-text span:nth-child(4) { color: var(--google-green); }

    /* --- INNOVATIVE CAPSULE BUTTONS --- */
    .nav-button-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .capsule-btn {
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 40px;
      width: 280px; /* Bigger width for the "capsule" look */
      border-radius: 100px; /* Perfect rounded ends */
      background: var(--glass);
      border: 1px solid var(--ms-border);
      backdrop-filter: blur(10px);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .capsule-btn img {
      width: 45px;
      height: 45px;
      object-fit: contain;
    }

    .capsule-btn span {
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 1px;
    }

    .capsule-btn:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--google-blue);
      box-shadow: 0 0 30px rgba(66, 133, 244, 0.2);
    }

    /* --- USER VISITING DASHBOARD --- */
    .visitor-dashboard {
      max-width: 1100px;
      margin: 80px auto 20px;
      padding: 40px;
      background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 100%);
      border-radius: 30px;
      border: 1px solid var(--ms-border);
      text-align: center;
    }

    .visitor-dashboard h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: #64748b;
      margin-bottom: 30px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .stat-item h3 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .stat-item p {
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Specific Stat Colors */
    .stat-blue { color: var(--google-blue); }
    .stat-red { color: var(--google-red); }
    .stat-yellow { color: var(--google-yellow); }
    .stat-green { color: var(--google-green); }

    /* --- FOOTER --- */
    .footer-box {
      text-align: center;
      padding: 60px 20px;
      border-top: 1px solid var(--ms-border);
    }

    .footer-logo {
      width: 250px;
      margin-bottom: 20px;
      filter: brightness(1.2);
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }

    .social-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--glass);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
      border: 1px solid var(--ms-border);
      transition: 0.3s;
    }

    .social-icon:hover {
      background: #fff;
      color: #000;
    }

    footer {
      text-align: center;
      padding: 30px;
      font-size: 11px;
      color: #475569;
    }

    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 30px; }
      .capsule-btn { width: 100%; max-width: 320px; }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      <img src="WEBB-removebg-preview.png" alt="GoGenix Logo">
    </div>
    <div class="right-logo">
      <img src="UniPlat.-removebg-preview.png" alt="United Platform">
    </div>
  </header>

  <div class="version-badge">UniPlat 2.0</div>

  <nav>
    <h1 class="brand-text">
      <span>Unified.</span> <span>Powerful.</span> <span>Free.</span> <span>Productive.</span>
    </h1>
    
    <div class="nav-button-container">
      <a href="webbtab.html" class="capsule-btn">
        <img src="UniPlat.-removebg-preview.png" alt="GenixTab">
        <span>GenixTab</span>
      </a>

      <a href="webbgames.html" class="capsule-btn">
        <img src="N-removebg-preview.png" alt="WebbJamm">
        <span>WebbJamm</span>
      </a>
    </div>
  </nav>

  <section class="visitor-dashboard">
    <h2>Global Interaction Insights</h2>
    <div class="stats-grid">
        <div class="stat-item">
            <h3 class="stat-blue">320</h3>
            <p>Active Users</p>
        </div>
        <div class="stat-item">
            <h3 class="stat-red">20+</h3>
            <p>Cities Joined</p>
        </div>
        <div class="stat-item">
            <h3 class="stat-yellow">15+</h3>
            <p>Countries</p>
        </div>
        <div class="stat-item">
            <h3 class="stat-green">2</h3>
            <p>Main Tabs</p>
        </div>
    </div>
  </section>

  <div class="footer-box">
    <img src="UNITED_PLATFORM__4_-removebg-preview.png" alt="Footer Logo" class="footer-logo">
    <div class="social-links">
        <a href="https://linkedin.com/..." class="social-icon"><i class="fab fa-linkedin-in"></i></a>
        <a href="https://instagram.com/..." class="social-icon"><i class="fab fa-instagram"></i></a>
    </div>
</div>

<footer>
    <p>© 2026 GOGENIX WEBB | A GO-GENIX WESER VENTURE</p>
</footer>

</body>
</html>
