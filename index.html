<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GoGenix Webb | UniPlat 2.0</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #080808;
      --google-blue: #4285F4;
      --google-red: #EA4335;
      --google-yellow: #FBBC05;
      --google-green: #34A853;
      --ms-border: rgba(255, 255, 255, 0.1);
      --glass: rgba(255, 255, 255, 0.03);
    }

    /* Reset and tap-highlight removal */
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; /* Removes blue flash on click */
    }

    html, body {
      width: 100%;
      min-height: 100vh; /* Ensures content fills the screen height */
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, #111827 0%, #080808 100%);
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column; /* Allows footer to push to bottom */
    }

    /* --- FULLY TRANSPARENT HEADER --- */
    header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: absolute; /* No overlapping panels, floats over BG */
      width: 100%;
      top: 0;
      z-index: 1000;
      background: transparent; 
    }

    .logo img {
      width: 180px;  /* Fixed size as requested */
      height: 180px; /* Fixed size as requested */
      object-fit: contain;
      filter: drop-shadow(0 0 15px rgba(255,255,255,0.05));
    }

    /* Main Container to fill mobile space */
    main {
      flex-grow: 1; /* Pushes footer down */
      display: flex;
      flex-direction: column;
      justify-content: center; /* Centers content vertically in the space */
      padding-top: 200px; /* Offset for the 180px logo */
    }

    .version-badge {
      text-align: center;
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--google-blue);
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    nav {
      text-align: center;
      padding: 0 5%;
    }

    /* ONE LINE TEXT FOR ALL DEVICES */
    .brand-text {
      font-size: clamp(14px, 3.2vw, 40px);
      font-weight: 800;
      margin-bottom: 40px;
      white-space: nowrap; /* Forces one line */
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .brand-text span:nth-child(1) { color: var(--google-blue); }
    .brand-text span:nth-child(2) { color: var(--google-red); }
    .brand-text span:nth-child(3) { color: var(--google-yellow); }
    .brand-text span:nth-child(4) { color: var(--google-green); }

    .nav-button-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 50px;
    }

    .capsule-btn {
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 25px;
      min-width: 160px;
      border-radius: 50px;
      background: var(--glass);
      border: 1px solid var(--ms-border);
      backdrop-filter: blur(10px);
      transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .capsule-btn img {
      width: 25px;
      height: 25px;
    }

    .capsule-btn span {
      color: #fff;
      font-weight: 600;
      font-size: 14px;
    }

    .capsule-btn:hover {
      transform: translateY(-5px) scale(1.05);
      border-color: var(--google-blue);
      box-shadow: 0 10px 20px rgba(66, 133, 244, 0.2);
    }

    /* --- VISITOR DASHBOARD: ADJUSTED FOR MOBILE SPACE --- */
    .visitor-dashboard {
      max-width: 90%;
      margin: 20px auto;
      padding: 30px;
      background: rgba(255,255,255,0.02);
      border-radius: 20px;
      border: 1px solid var(--ms-border);
    }

    .stats-grid {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .stat-item { text-align: center; }
    .stat-item h3 { font-size: clamp(20px, 5vw, 32px); font-weight: 800; margin-bottom: 5px; }
    .stat-item p { font-size: 10px; color: #94a3b8; text-transform: uppercase; }

    .stat-blue { color: var(--google-blue); }
    .stat-red { color: var(--google-red); }
    .stat-yellow { color: var(--google-yellow); }
    .stat-green { color: var(--google-green); }

    /* --- FOOTER --- */
    .footer-box {
      text-align: center;
      padding: 40px 20px;
      border-top: 1px solid var(--ms-border);
      margin-top: auto; /* Sticky to bottom */
    }

    .footer-logo {
      width: 180px;
      margin-bottom: 20px;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .social-icon {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: var(--glass);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
      border: 1px solid var(--ms-border);
      transition: 0.3s;
    }

    .social-icon:hover { background: #fff; color: #000; }

    footer { padding: 20px; text-align: center; font-size: 10px; color: #475569; }

    /* MOBILE: Force content to expand and fill space */
    @media (max-width: 600px) {
      main { justify-content: space-evenly; } /* Distributes space between items */
      .brand-text { font-size: 3.5vw; }
      .nav-button-container { flex-direction: row; gap: 10px; }
      .capsule-btn { padding: 10px 15px; min-width: 140px; }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      <img src="WEBB-removebg-preview.png" alt="GoGenix Logo">
    </div>
  </header>

  <main>
    <div class="version-badge">UniPlat 2.0</div>

    <nav>
      <h1 class="brand-text">
        <span>Unified.</span> <span>Powerful.</span> <span>Free.</span> <span>Productive.</span>
      </h1>
      
      <div class="nav-button-container">
        <a href="webbtab.html" class="capsule-btn">
          <img src="UniPlat.-removebg-preview.png" alt="GenixTab">
          <span>GenixTab</span>
        </a>

        <a href="webbgames.html" class="capsule-btn">
          <img src="N-removebg-preview.png" alt="WebbJamm">
          <span>WebbJamm</span>
        </a>
      </div>
    </nav>

    <section class="visitor-dashboard">
      <div class="stats-grid">
          <div class="stat-item">
              <h3 class="stat-blue">320</h3>
              <p>Users</p>
          </div>
          <div class="stat-item">
              <h3 class="stat-red">20+</h3>
              <p>Cities</p>
          </div>
          <div class="stat-item">
              <h3 class="stat-yellow">15+</h3>
              <p>Countries</p>
          </div>
          <div class="stat-item">
              <h3 class="stat-green">2</h3>
              <p>Tabs</p>
          </div>
      </div>
    </section>
  </main>

  <div class="footer-box">
    <img src="UNITED_PLATFORM__4_-removebg-preview.png" alt="Footer Logo" class="footer-logo">
    <div class="social-links">
        <a href="https://linkedin.com/..." class="social-icon"><i class="fab fa-linkedin-in"></i></a>
        <a href="https://instagram.com/..." class="social-icon"><i class="fab fa-instagram"></i></a>
    </div>
  </div>

  <footer>
    <p>© 2026 GOGENIX WEBB | UNIFIED PLATFORM SYSTEM</p>
  </footer>

</body>
</html>
