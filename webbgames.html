<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebbJamm | The Genixified GameSpot</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-dark: #080808;
            --google-blue: #4285F4;
            --google-red: #EA4335;
            --google-yellow: #FBBC05;
            --google-green: #34A853;
            --ms-border: rgba(255, 255, 255, 0.1);
            --glass: rgba(255, 255, 255, 0.03);
            --sidebar-width: 280px;
        }

        /* RESET & BASE */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top right, #1e293b, #080808);
            color: #fff;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- UNIFIED HEADER (180px Logo) --- */
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: absolute;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .logo-box img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(66, 133, 244, 0.2));
        }

        /* --- STICKY NAV PILL --- */
        nav {
            position: sticky;
            top: 20px;
            z-index: 2000;
            margin: 0 auto;
            width: 90%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid var(--ms-border);
            border-radius: 100px;
            margin-top: 210px; /* Offset for 180px logo */
        }

        .menu-toggle-btn {
            background: var(--glass);
            color: #fff;
            font-weight: 700;
            font-size: 12px;
            padding: 10px 20px;
            border: 1px solid var(--ms-border);
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .menu-toggle-btn:hover {
            border-color: var(--google-blue);
            background: rgba(66, 133, 244, 0.1);
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: rgba(8, 8, 8, 0.98);
            backdrop-filter: blur(30px);
            border-right: 1px solid var(--ms-border);
            padding: 40px 25px;
            position: fixed;
            left: -300px;
            top: 0;
            z-index: 4000;
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar.active { left: 0; box-shadow: 40px 0 100px rgba(0,0,0,0.8); }

        .category-item {
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 18px;
            cursor: pointer;
            transition: 0.3s;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 600;
        }

        .category-item:hover, .category-item.active {
            background: var(--glass);
            color: var(--google-blue);
            border: 1px solid var(--ms-border);
        }

        /* --- MAIN CONTENT --- */
        .content-area { padding: 50px 5%; flex-grow: 1; }

        .brand-text {
            text-align: center;
            font-size: clamp(12px, 3.5vw, 38px);
            font-weight: 800;
            margin-bottom: 50px;
            white-space: nowrap;
            display: flex;
            justify-content: center;
            gap: 1.5vw;
        }

        .brand-text span:nth-child(1) { color: var(--google-blue); }
        .brand-text span:nth-child(2) { color: var(--google-red); }
        .brand-text span:nth-child(3) { color: var(--google-yellow); }
        .brand-text span:nth-child(4) { color: var(--google-green); }

        .section-header h2 {
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 30px;
            text-align: center;
        }

        /* --- GAME CARDS --- */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .game-card {
            background: var(--glass);
            border: 1px solid var(--ms-border);
            border-radius: 30px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .game-card:not(.locked-card):hover {
            transform: translateY(-10px);
            border-color: var(--google-blue);
            background: rgba(255,255,255,0.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .game-icon {
            font-size: 50px;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.3));
        }

        .game-card h3 { font-size: 20px; margin-bottom: 10px; letter-spacing: 1px; }
        .game-card p { font-size: 14px; color: #64748b; line-height: 1.6; flex-grow: 1; }

        .play-btn {
            background: #fff;
            color: #000;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 800;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 25px;
            transition: 0.3s;
            width: 100%;
        }

        .game-card:hover .play-btn { background: var(--google-blue); color: #fff; }

        .locked-card { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }

        /* --- FOOTER --- */
        footer {
            padding: 40px;
            text-align: center;
            border-top: 1px solid var(--ms-border);
            font-size: 10px;
            color: #475569;
            letter-spacing: 2px;
        }

        /* --- MOBILE --- */
        @media (max-width: 600px) {
            nav { width: 95%; padding: 10px 15px; margin-top: 190px; }
            .logo-box img { width: 150px; height: 150px; }
            .games-grid { grid-template-columns: 1fr; gap: 20px; }
            .brand-text { font-size: 4vw; }
            .game-card { padding: 30px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo-box">
        <img src="N-removebg-preview.png" alt="WebbJamm Logo">
    </div>
</header>

<aside class="sidebar" id="sidebar">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
        <h3 style="color: var(--google-blue); letter-spacing: 2px; font-size: 14px;">GENIX MENU</h3>
        <div style="cursor:pointer; font-size: 20px; color: #64748b;" onclick="toggleSidebar()">✕</div>
    </div>
    <ul style="list-style: none;">
        <li class="category-item active" onclick="loadCategory('trending')"><span>🔥</span> Trending</li>
        <li class="category-item" onclick="loadCategory('retro')"><span>🕹️</span> Retro</li>
        <li class="category-item" onclick="loadCategory('brain')"><span>🧠</span> Brain</li>
        <li class="category-item" onclick="loadCategory('action')"><span>⚔️</span> Action</li>
        <li class="category-item" onclick="loadCategory('skills')"><span>⌨️</span> Skills</li>
    </ul>
</aside>

<nav>
    <span style="font-weight: 900; font-size: 12px; letter-spacing: 2px; color: var(--google-blue);">JAMM v2.0</span>
    <button class="menu-toggle-btn" onclick="toggleSidebar()">☰ CATEGORIES</button>
</nav>

<div class="content-area">
    <h1 class="brand-text">
        <span>Unified.</span> <span>Powerful.</span> <span>Free.</span> <span>Productive.</span>
    </h1>

    <div class="section-header">
        <h2 id="cat-title">Trending Games</h2>
    </div>

    <div class="games-grid" id="game-display">
        </div>
</div>

<footer>
    © 2026 GOGENIX WEBB | WEBBJAMM ARCADE SYSTEM
</footer>

<script>
    const allGames = {
        trending: [ 
            { name: "Tic-Tac-Toe", icon: "🎯", live: true, link: "ticgame.html", desc: "Elite strategy battle with AI and Friends." },
            { name: "Snake Pro", icon: "🐍", live: true, link: "snake.html", desc: "Neon survival in a growing digital world." },
            { name: "Flappy Bird", icon: "🐥", live: true, link: "flappybird.html" , desc: "Classic bird game on your fingertips." },
            { name: "Neon Breaker", icon: "🧱", live: true, link:"neonbreaker.html", desc: "Classic paddle and ball action." },
            { name: "Tetris Genix", icon: "🔳", live: true, link:"tetrisgenix.html", desc: "Falling block puzzle legend." }
        ],
        retro: [
            { name: "Neon Breaker", icon: "🧱", live: true, link:"neonbreaker.html", desc: "Classic paddle and ball action." },
            { name: "Tetris Genix", icon: "🔳", live: true, link:"tetrisgenix.html", desc: "Falling block puzzle legend." }
        ],
        brain: [
            { name: "Chess Webb", icon: "♟️", live: false, desc: "Challenge the grandmaster AI." },
            { name: "2048 Neon", icon: "🧊", live: false, desc: "Merge numbers to reach the goal." }
        ],
        action: [
            { name: "Cyber Runner", icon: "🏃", live: false, desc: "Fast-paced neon parkour quest." },
            { name: "Shadow Ninja", icon: "🥷", live: false, desc: "Master the art of stealth combat." }
        ],
        skills: [
            { name: "Aim Lab", icon: "🔫", live: false, desc: "The ultimate precision click trainer." },
            { name: "Guitar Hero", icon: "🎸", live: false, desc: "Hit the notes to become a legend." }
        ]
    };

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
    }

    function loadCategory(cat) {
        const grid = document.getElementById('game-display');
        const title = document.getElementById('cat-title');
        
        title.innerText = cat === 'trending' ? 'Trending Games' : cat.charAt(0).toUpperCase() + cat.slice(1) + ' Games';
        grid.innerHTML = "";

        allGames[cat].forEach(game => {
            const card = document.createElement('div');
            card.className = `game-card ${game.live ? '' : 'locked-card'}`;
            card.innerHTML = `
                <div class="game-icon">${game.icon}</div>
                <h3>${game.name}</h3>
                <p>${game.desc}</p>
                ${game.live ? `<a href="${game.link}" class="play-btn">PLAY NOW</a>` : `<span class="play-btn" style="background:rgba(255,255,255,0.05); color:#475569; border:1px solid transparent;">LOCKED</span>`}
            `;
            grid.appendChild(card);
        });

        if(window.innerWidth < 1000) document.getElementById('sidebar').classList.remove('active');

        document.querySelectorAll('.category-item').forEach(el => {
            el.classList.remove('active');
            if(el.innerText.toLowerCase().includes(cat)) el.classList.add('active');
        });
    }

    loadCategory('trending');
</script>

</body>
</html>
