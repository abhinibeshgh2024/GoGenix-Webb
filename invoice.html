<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Webb | Invoice Generator</title>
  
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QXVCXKPVBC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QXVCXKPVBC');
  </script>

  <link rel="icon" type="image/jpeg" sizes="32x32" href="favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #080808;
      --google-blue: #4285F4;
      --ms-border: rgba(255, 255, 255, 0.1);
      --glass: rgba(255, 255, 255, 0.03);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, #111827 0%, #080808 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* --- UNIFIED HEADER --- */
    header {
      padding: 40px 20px;
      text-align: center;
      width: 100%;
    }

    header img {
      width: 180px;
      height: 180px;
      object-fit: contain;
    }

    header h2 {
      font-size: 14px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--google-blue);
      font-weight: 900;
      margin-top: -10px;
    }

    header p { font-size: 11px; color: #475569; letter-spacing: 2px; margin-top: 8px; }

    /* --- FORM LAYOUT --- */
    .container {
      width: 90%;
      max-width: 1000px;
      margin-bottom: 80px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .card {
      background: var(--glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--ms-border);
      border-radius: 30px;
      padding: 30px;
      transition: 0.3s;
    }

    .card:hover { border-color: rgba(66, 133, 244, 0.3); }

    .full-width { grid-column: span 2; }

    h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #64748b;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--ms-border);
      padding-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h2 i { color: var(--google-blue); }

    /* --- INPUTS --- */
    input, textarea, select {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--ms-border);
      border-radius: 12px;
      padding: 12px 15px;
      color: #fff;
      margin-bottom: 12px;
      font-size: 14px;
      outline: none;
      transition: 0.3s;
    }

    input:focus { border-color: var(--google-blue); background: rgba(66, 133, 244, 0.05); }

    /* --- ITEM ROWS --- */
    .item-row {
      display: grid;
      grid-template-columns: 2fr 0.5fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .btn {
      padding: 15px 25px;
      border-radius: 100px;
      border: none;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn.primary { background: var(--google-blue); color: #fff; width: 100%; }
    .btn.secondary { background: var(--glass); color: #fff; border: 1px solid var(--ms-border); }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

    .action { grid-column: span 2; padding-top: 20px; }

    /* --- SIGNATURE OPTIONS --- */
    .sign-options {
      display: flex;
      gap: 20px;
      font-size: 13px;
      color: #94a3b8;
    }

    .sign-options label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    /* --- MOBILE --- */
    @media (max-width: 800px) {
      .container { grid-template-columns: 1fr; }
      .full-width { grid-column: span 1; }
      .action { grid-column: span 1; }
    }
  </style>
</head>
<body>

<header>
  <img src="WEBB-removebg-preview.png" alt="Webb Logo">
  <h2>Webb Invoice Generator</h2>
  <p>Professional • Secure • Instant Billing</p>
</header>

<main class="container">

  <section class="card">
    <h2><i class="fa fa-building"></i> Sender Details</h2>
    <input id="businessName" placeholder="Business Name (e.g. GoGenix)">
    <input id="businessAddress" placeholder="Business Address">
    <input id="businessEmail" placeholder="Business Email">
    <input id="businessPhone" placeholder="Contact Number">
  </section>

  <section class="card">
    <h2><i class="fa fa-user-tie"></i> Client Details</h2>
    <input id="clientName" placeholder="Client / Company Name">
    <input id="clientAddress" placeholder="Client Address">
    <input id="clientEmail" placeholder="Client Email">
  </section>

  <section class="card">
    <h2><i class="fa fa-file-invoice"></i> Metadata</h2>
    <input id="invoiceNumber" placeholder="Invoice # (e.g. INV-001)">
    <div style="display: flex; gap: 10px;">
      <div style="flex:1"><label style="font-size:9px; color:#64748b">Issue Date</label><input type="date" id="invoiceDate"></div>
      <div style="flex:1"><label style="font-size:9px; color:#64748b">Due Date</label><input type="date" id="dueDate"></div>
    </div>
  </section>

  <section class="card">
    <h2><i class="fa fa-percent"></i> Tax & Adjustments</h2>
    <input id="tax" type="number" placeholder="Tax (e.g. 18%)">
    <input id="discount" type="number" placeholder="Discount (e.g. 10%)">
    <div class="sign-options">
        <label><input type="checkbox" id="digitalSign" onchange="selectSign('digital')"> Digital Sign</label>
        <label><input type="checkbox" id="manualSign" onchange="selectSign('manual')"> Manual Sign</label>
    </div>
  </section>

  <section class="card full-width">
    <h2><i class="fa fa-list-ol"></i> Line Items</h2>
    <div id="items">
      <div class="item-row">
        <input class="item-name" placeholder="Item/Service Description">
        <input class="item-qty" type="number" placeholder="Qty">
        <input class="item-price" type="number" placeholder="Price per Unit">
      </div>
    </div>
    <button class="btn secondary" onclick="addItem()"><i class="fa fa-plus"></i> Add Item Row</button>
  </section>

  <section class="card full-width">
    <h2><i class="fa fa-sticky-note"></i> Terms & Conditions</h2>
    <textarea id="notes" placeholder="Enter payment instructions, UPI IDs, or special notes..."></textarea>
  </section>

  <div class="action">
    <button class="btn primary" onclick="generateInvoice()">
      <i class="fa fa-check-circle"></i> Finalize & Download PDF
    </button>
  </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script src="invoice.js"></script>

<script>
  // UI helper for checkbox selection
  function selectSign(type) {
    if (type === 'digital') {
      document.getElementById('manualSign').checked = false;
    } else {
      document.getElementById('digitalSign').checked = false;
    }
  }

  // Bridging the addItem from your invoice.js to match the new UI grid
  const originalAddItem = window.addItem;
  window.addItem = function() {
      const container = document.getElementById('items');
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `
        <input class="item-name" placeholder="Item Name">
        <input class="item-qty" type="number" placeholder="Qty">
        <input class="item-price" type="number" placeholder="Price">
      `;
      container.appendChild(row);
  };
</script>

</body>
</html>
